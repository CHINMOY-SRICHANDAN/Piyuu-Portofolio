<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Priya Srivastava — UGC Creator & Model Portfolio</title>
    <meta name="description"
        content="Mumbai-based UGC Creator & Model. Specializing in Beauty, Skincare, Tech, Lifestyle, Fashion & Jewellery content creation." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F5F0EB',
                        'cream-dark': '#EDE6DE',
                        'cream-light': '#FAF8F5',
                        pink: '#F2A0C0',
                        'pink-deep': '#E87DA3',
                        'pink-light': '#FADCE8',
                        'pink-glow': '#F9C5D8',
                        charcoal: '#1A1A1A',
                        'warm-gray': '#6B6B6B',
                        'light-gray': '#9E9E9E',
                        'surface-white': 'rgba(255,255,255,0.7)',
                    },
                    fontFamily: {
                        script: ['Dancing Script', 'cursive'],
                        display: ['Poppins', 'sans-serif'],
                        body: ['DM Sans', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                },
            },
        };
    </script>
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <style>
        /* ===== BASE RESET ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #F5F0EB;
            color: #1A1A1A;
            font-family: 'DM Sans', sans-serif;
            overflow-x: hidden;
        }

        ::selection {
            background: rgba(242, 160, 192, 0.35);
            color: #1A1A1A;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #F5F0EB;
        }

        ::-webkit-scrollbar-thumb {
            background: #F2A0C0;
            border-radius: 10px;
        }

        /* ===== PAGE LOADER ===== */
        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 100000;
            background: #F5F0EB;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
        }

        .page-loader.exit {
            animation: loaderExit 0.8s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        }

        @keyframes loaderExit {
            0% {
                clip-path: inset(0 0 0 0);
            }

            100% {
                clip-path: inset(0 0 100% 0);
                opacity: 0;
                pointer-events: none;
            }
        }

        .loader-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: clamp(2rem, 6vw, 4rem);
            color: #F2A0C0;
            letter-spacing: -0.02em;
            animation: loaderPulse 1.5s ease-in-out infinite;
        }

        .loader-sub {
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            color: #1A1A1A;
            animation: loaderPulse 1.5s ease-in-out infinite 0.2s;
        }

        @keyframes loaderPulse {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.98);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ===== TOP SCROLL PROGRESS BAR ===== */
        .scroll-progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #F2A0C0 0%, #E87DA3 50%, #F7C5D8 100%);
            transform-origin: 0% 50%;
            transform: scaleX(0);
            z-index: 999999;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.08s ease-out;
        }

        /* ===== LUXURY AMBIENT SPOTLIGHT ===== */
        .ambient-spotlight {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(650px circle at var(--mouse-x, 50vw) var(--mouse-y, 30vh), rgba(242, 160, 192, 0.09), transparent 75%);
            transition: background 0.15s ease-out;
        }

        /* ===== SCROLL ANIMATIONS (60FPS HARDWARE ACCELERATED) ===== */
        .reveal {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(0, 32px, 0);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity, filter;
        }

        .reveal.visible {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0);
        }

        .reveal-left {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(-40px, 0, 0);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity, filter;
        }

        .reveal-left.visible {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0);
        }

        .reveal-right {
            opacity: 0;
            filter: blur(8px);
            transform: translate3d(40px, 0, 0);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity, filter;
        }

        .reveal-right.visible {
            opacity: 1;
            filter: blur(0px);
            transform: translate3d(0, 0, 0);
        }

        .reveal-scale {
            opacity: 0;
            filter: blur(6px);
            transform: scale3d(0.92, 0.92, 1);
            transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity, filter;
        }

        .reveal-scale.visible {
            opacity: 1;
            filter: blur(0px);
            transform: scale3d(1, 1, 1);
        }

        .d1 { transition-delay: 0ms; }
        .d2 { transition-delay: 80ms; }
        .d3 { transition-delay: 160ms; }
        .d4 { transition-delay: 240ms; }
        .d5 { transition-delay: 320ms; }
        .d6 { transition-delay: 400ms; }
        .d7 { transition-delay: 480ms; }
        .d8 { transition-delay: 560ms; }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-portfolio {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: clamp(4rem, 14vw, 14rem);
            color: #F2A0C0;
            letter-spacing: -0.03em;
            line-height: 0.85;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            user-select: none;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-creative {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 7vw, 7rem);
            color: #1A1A1A;
            position: relative;
            z-index: 3;
            line-height: 1;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-photo-container {
            position: relative;
            z-index: 2;
            width: clamp(220px, 30vw, 380px);
            height: clamp(300px, 42vw, 520px);
            box-shadow: 0 25px 70px -15px rgba(242, 160, 192, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.8);
            animation: heroLevitate 6s ease-in-out infinite;
            will-change: transform, box-shadow;
            overflow: hidden;
            transition: box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .hero-photo-container:hover {
            box-shadow: 0 35px 90px -15px rgba(242, 160, 192, 0.6), 0 0 0 2px rgba(242, 160, 192, 0.4);
        }

        @keyframes heroLevitate {
            0%, 100% {
                transform: translate3d(0, 0, 0);
            }
            50% {
                transform: translate3d(0, -10px, 0);
            }
        }

        .hero-photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            filter: contrast(1.02) brightness(1.02);
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .hero-photo-container:hover img {
            transform: scale3d(1.04, 1.04, 1);
            filter: contrast(1.04) brightness(1.03);
        }

        .hero-niche {
            font-family: 'DM Sans', sans-serif;
            font-style: italic;
        }

        .hero-niche-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #F2A0C0;
            margin: 0 10px;
            vertical-align: middle;
        }

        /* Floating shapes */
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            animation: floatShape 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes floatShape {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            25% {
                transform: translate(20px, -30px) rotate(5deg);
            }

            50% {
                transform: translate(-15px, 15px) rotate(-3deg);
            }

            75% {
                transform: translate(25px, 20px) rotate(4deg);
            }
        }

        /* Scroll CTA */
        .scroll-cta {
            animation: scrollPulse 2.5s ease-in-out infinite;
        }

        @keyframes scrollPulse {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.5;
            }

            50% {
                transform: translateY(8px);
                opacity: 1;
            }
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: #F2A0C0;
            color: #fff;
            border: none;
            border-radius: 60px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 40px rgba(242, 160, 192, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, transparent 50%);
            pointer-events: none;
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: transparent;
            color: #1A1A1A;
            border: 2px solid #1A1A1A;
            border-radius: 60px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-outline::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #1A1A1A;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: -1;
        }

        .btn-outline:hover {
            color: #F5F0EB;
            border-color: #1A1A1A;
        }

        .btn-outline:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        .btn-pink-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 28px;
            background: transparent;
            color: #E87DA3;
            border: 2px solid #F2A0C0;
            border-radius: 60px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-pink-outline:hover {
            background: #F2A0C0;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(242, 160, 192, 0.25);
        }

        /* ===== SECTION LABEL ===== */
        .section-tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #F2A0C0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-tag::before {
            content: '';
            width: 30px;
            height: 2px;
            background: #F2A0C0;
            border-radius: 2px;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            color: #1A1A1A;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .section-title-pink {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            color: #F2A0C0;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .section-subtitle {
            color: #6B6B6B;
            line-height: 1.7;
            max-width: 540px;
        }

        /* ===== CARDS (60FPS SPECULAR SHEEN) ===== */
        .card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
            position: relative;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, box-shadow;
        }

        .card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,
                transparent 30%,
                rgba(255, 255, 255, 0.45) 50%,
                transparent 70%
            );
            transform: translate3d(-100%, 0, 0) rotate(25deg);
            transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            z-index: 5;
        }

        .card:hover {
            transform: translate3d(0, -8px, 0);
            box-shadow: 0 24px 65px -15px rgba(242, 160, 192, 0.3), 0 0 0 1px rgba(242, 160, 192, 0.25);
            border-color: rgba(242, 160, 192, 0.35);
        }

        .card:hover::after {
            transform: translate3d(100%, 0, 0) rotate(25deg);
        }

        /* ===== MARQUEE (60FPS GPU ACCELERATED) ===== */
        .marquee-wrap {
            overflow: hidden;
            position: relative;
        }

        .marquee-inner {
            display: flex;
            gap: 48px;
            width: max-content;
            animation: marqueeScroll 55s linear infinite;
            will-change: transform;
        }

        .marquee-inner:hover {
            animation-play-state: paused;
        }

        @keyframes marqueeScroll {
            0% {
                transform: translate3d(0, 0, 0);
            }

            100% {
                transform: translate3d(-50%, 0, 0);
            }
        }

        /* ===== UPLOAD ZONE ===== */
        .upload-zone {
            border: 2px dashed rgba(0, 0, 0, 0.12);
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: #F2A0C0;
            background: rgba(242, 160, 192, 0.04);
            box-shadow: 0 0 0 4px rgba(242, 160, 192, 0.08);
        }

        /* ===== PROGRESS RING ===== */
        .progress-ring-circle {
            transition: stroke-dashoffset 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            animation: modalFadeIn 0.3s forwards;
        }

        @media (min-width: 768px) {
            .modal-overlay {
                align-items: center;
            }
        }

        .modal-panel {
            background: #fff;
            border-radius: 28px 28px 0 0;
            max-height: 92vh;
            overflow-y: auto;
            transform: translateY(100%);
            opacity: 0;
            animation: modalSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
            width: 100%;
            max-width: 520px;
        }

        @media (min-width: 768px) {
            .modal-panel {
                border-radius: 28px;
                transform: translateY(40px) scale(0.96);
            }

            @keyframes modalSlideUp {
                to {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
            }
        }

        @keyframes modalFadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes modalSlideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* ===== LIGHTBOX ===== */
        .lightbox-overlay {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: modalFadeIn 0.3s forwards;
        }

        .lightbox-media {
            transform: scale(0.92);
            opacity: 0;
            animation: lightboxZoom 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        @keyframes lightboxZoom {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== TESTIMONIAL CAROUSEL ===== */
        .testimonial-scroll {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: testimonialMove 45s linear infinite;
        }

        .testimonial-scroll:hover {
            animation-play-state: paused;
        }

        @keyframes testimonialMove {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        /* ===== FORM INPUTS ===== */
        .input-field {
            width: 100%;
            padding: 14px 18px;
            background: #FAF8F5;
            border: 1.5px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: #1A1A1A;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-field:focus {
            outline: none;
            border-color: #F2A0C0;
            box-shadow: 0 0 0 4px rgba(242, 160, 192, 0.1);
            background: #fff;
        }

        .input-field::placeholder {
            color: #BEBEBE;
        }

        /* ===== FILTER TABS ===== */
        .filter-chip {
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1.5px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            color: #6B6B6B;
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            will-change: transform;
        }

        .filter-chip:hover {
            border-color: #F2A0C0;
            color: #E87DA3;
            transform: translate3d(0, -2px, 0);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 6px 20px rgba(242, 160, 192, 0.2);
        }

        .filter-chip.active {
            background: #F2A0C0;
            color: #fff;
            border-color: #F2A0C0;
            transform: translate3d(0, -2px, 0);
            box-shadow: 0 8px 25px rgba(242, 160, 192, 0.35);
        }

        /* ===== PRICING (60FPS SPECULAR SHEEN) ===== */
        .pricing-card {
            background: #fff;
            border-radius: 24px;
            border: 1.5px solid rgba(0, 0, 0, 0.06);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        .pricing-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #F2A0C0, #F9C5D8, #F2A0C0);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 6;
        }

        .pricing-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                60deg,

        function useReveal(cls = 'reveal') {
            const ref = useRef(null);
            useEffect(() => {
                const el = ref.current; if (!el) return;
                const ob = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting) { el.classList.add('visible'); ob.unobserve(el); }
                }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
                ob.observe(el);
                return () => ob.disconnect();
            }, []);
            return ref;
        }
        function useCountUp(end, dur = 2200) {
            const [val, setVal] = useState(0);
            const ref = useRef(null);
            
            useEffect(() => {
                const el = ref.current; 
                if (!el) return;
                
                let rafId;
                const ob = new IntersectionObserver(([e]) => {
                    if (e.isIntersecting) {
                        let startTime = null;
                        const animate = (timestamp) => {
                            if (!startTime) startTime = timestamp;
                            const elapsed = timestamp - startTime;
                            const progress = Math.min(elapsed / dur, 1);
                            // Quartic ease-out for silky smooth deceleration
                            const easeOut = 1 - Math.pow(1 - progress, 4);
                            setVal(Math.round(easeOut * end));
                            if (progress < 1) {
                                rafId = requestAnimationFrame(animate);
                            }
                        };
                        rafId = requestAnimationFrame(animate);
                        ob.unobserve(el);
                    }
                }, { threshold: 0.3 });
                
                ob.observe(el);
                
                return () => {
                    ob.disconnect();
                    if (rafId) cancelAnimationFrame(rafId);
                };
            }, [end, dur]);
            return [val, ref];

        function compressImage(file, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                if (!file.type || !file.type.startsWith('image/')) {
                    const r = new FileReader();
                    r.onload = e => resolve({ name: file.name, size: file.size, type: file.type, url: e.target.result });
                    r.readAsDataURL(file);
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let { width, height } = img;
                        if (width > maxWidth || height > maxWidth) {
                            if (width > height) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            } else {
                                width = Math.round((width * maxWidth) / height);
                                height = maxWidth;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressed = canvas.toDataURL('image/jpeg', quality);
                        resolve({
                            name: file.name,
                            size: Math.round(compressed.length * 0.75),
                            type: 'image/jpeg',
                            url: compressed
                        });
                    };
                    img.onerror = () => {
                        resolve({ name: file.name, size: file.size, type: file.type, url: e.target.result });
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        /* ====== UPLOAD ZONE ====== */
        function UploadZone({ onFiles, multiple = false, accept = "image/*,video/*", label, className = '' }) {
            const [drag, setDrag] = useState(false);
            const [uploading, setUploading] = useState(false);
            const [progress, setProgress] = useState(0);
            const inp = useRef(null);
            const process = async (fList) => {
                const ok = ['image/', 'video/'];
                const files = Array.from(fList).filter(f => ok.some(t => f.type.startsWith(t)));
                if (!files.length) return;
                setUploading(true); setProgress(5);
                try {
                    const totalFiles = files.length;
                    const progressMap = {};
                    const uploadPromises = files.map((f, idx) => {
                        return uploadFileToFirebase(f, (pct) => {
                            progressMap[idx] = pct;
                            const totalPct = Object.values(progressMap).reduce((a, b) => a + b, 0) / totalFiles;
                            setProgress(Math.min(99, Math.round(totalPct)));
                        });
                    });
                    const results = await Promise.all(uploadPromises);
                    setProgress(100);
                    setTimeout(() => {
                        onFiles(results);
                        setUploading(false);
                        setProgress(0);
                    }, 300);
                } catch (err) {
                    console.error("Upload error:", err);
                    setUploading(false);
                    setProgress(0);
                }
            };
            const circ = 2 * Math.PI * 26;
            return (
                <div className={`upload-zone p-8 flex flex-col items-center justify-center gap-3 text-center ${drag ? 'drag-over' : ''} ${className}`}
                    onDragOver={e => { e.preventDefault(); setDrag(true) }} onDragLeave={() => setDrag(false)}
                    onDrop={e => { e.preventDefault(); setDrag(false); process(e.dataTransfer.files) }}
                    onClick={() => !uploading && inp.current?.click()} role="button" tabIndex={0}
                    aria-label={label || "Upload files"} onKeyDown={e => { if (e.key === 'Enter') inp.current?.click() }}>
                    <input ref={inp} type="file" className="hidden" accept={accept} multiple={multiple} onChange={e => { if (e.target.files.length) process(e.target.files); e.target.value = ''; }} />
                    {uploading ? (
                        <div className="relative w-16 h-16">
                            <svg className="w-16 h-16" viewBox="0 0 60 60">
                                <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(0,0,0,0.06)" strokeWidth="3" />
                                <circle className="progress-ring-circle" cx="30" cy="30" r="26" fill="none" stroke="#F2A0C0" strokeWidth="3"
                                    strokeDasharray={circ} strokeDashoffset={circ - (progress / 100) * circ} strokeLinecap="round" />
                            </svg>
                            <span className="absolute inset-0 flex items-center justify-center text-xs font-mono text-pink-deep font-bold">{Math.round(progress)}%</span>
                        </div>
                    ) : (
                        <Fragment>
                            <div className="w-12 h-12 rounded-full bg-pink-light flex items-center justify-center text-pink-deep"><I.Upload /></div>
                            <p className="text-sm text-warm-gray font-medium">{label || "Drag & drop or click to upload"}</p>
                            <p className="text-xs text-light-gray font-mono">JPG, PNG, MP4 accepted (Cloud Synced)</p>
                        </Fragment>
                    )}
                </div>
            );
        }

                            </div>
                            <div className="flex flex-wrap justify-center gap-6">
                                {['About', 'Portfolio', 'Rates', 'Contact'].map(l => <a key={l} href={`#${l.toLowerCase()}`} className="text-xs text-white/40 hover:text-pink transition-colors uppercase tracking-wider font-mono">{l}</a>)}
                            </div>
                            <p className="text-xs text-white/25 font-mono select-none">© 2026 Priya Srivastava
                                <button onClick={onAdminClick} className="ml-2 text-white/15 hover:text-white/50 transition-all text-sm" title={isAdmin ? 'Exit Admin Mode' : 'Admin'}>
                                    {isAdmin ? '🔓' : '🔒'}
                                </button>
                            </p>
                        </div>
                    </div>
                </footer>
            );
        }
        /* ====== APP ====== */
        function App() {
            const [loading, setLoading] = useState(true);
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLogin, setShowLogin] = useState(false);
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState(false);
            const [syncStatus, setSyncStatus] = useState('connecting'); // 'connecting' | 'synced' | 'saving' | 'offline'
            const ADMIN_PASS = 'priya@7777';

            const [uploads, dispatch] = useReducer(reducer, {
                bio: '', profilePhoto: [], deals: [], gallery: [], photos: [], socials: DEFAULT_STATE.socials, photoCategories: DEFAULT_STATE.photoCategories
            });
            const isLoaded = useRef(false);
            const isRemoteUpdate = useRef(false);

            useEffect(() => {
                loadCloudState().then(saved => {
                    if (saved) {
                        dispatch({ type: 'SET_STATE', state: saved });
                    } else if (INITIAL_PERSISTED_STATE) {
                        dispatch({ type: 'SET_STATE', state: INITIAL_PERSISTED_STATE });
                    } else {
                        dispatch({ type: 'SET_STATE', state: DEFAULT_STATE });
                    }
                    isLoaded.current = true;
                    setSyncStatus('synced');
                    // Hide page loader with nice delay
                    const loader = document.querySelector('.page-loader');
                    if (loader) {
                        loader.classList.add('exit');
                        setTimeout(() => setLoading(false), 800);
                    } else {
                        setLoading(false);
                    }
                }).catch(err => {
                    console.warn("Initial state load notice:", err);
                    isLoaded.current = true;
                    setSyncStatus('offline');
                    setLoading(false);
                });

                // Real-time listener for multi-device sync
                let unsubscribe = null;
                const docRef = getPortfolioDoc();
                if (docRef) {
                    unsubscribe = docRef.onSnapshot(doc => {
                        if (doc && doc.exists && !doc.metadata.hasPendingWrites) {
                            const cloudData = doc.data();
                            if (cloudData) {
                                isRemoteUpdate.current = true;
                                dispatch({ type: 'SET_STATE', state: cloudData });
                                saveState(cloudData).catch(() => {});
                                setTimeout(() => { isRemoteUpdate.current = false; }, 100);
                            }
                        }
                    }, err => {
                        console.warn("Firestore real-time listener notice:", err);
                    });
                }
                return () => { if (unsubscribe) unsubscribe(); };
            }, []);

            useEffect(() => {
                if (isLoaded.current && !isRemoteUpdate.current) {
                    setSyncStatus('saving');
                    saveCloudState(uploads);
                    const t = setTimeout(() => setSyncStatus('synced'), 600);
                    return () => clearTimeout(t);
                }
            }, [uploads]);

            useEffect(() => {
                const handler = (e) => {
                    if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
                        e.preventDefault();
                        if (isAdmin) setIsAdmin(false);
                        else { setShowLogin(true); setLoginPass(''); setLoginError(false); }
                    }
                };
                window.addEventListener('keydown', handler);
                return () => window.removeEventListener('keydown', handler);
            }, [isAdmin]);

            useEffect(() => {
                const onScroll = () => {
                    const bar = document.querySelector('.scroll-progress-bar');
                    if (!bar) return;
                    const max = document.documentElement.scrollHeight - window.innerHeight;
                    const pct = max > 0 ? window.scrollY / max : 0;
                    bar.style.transform = `scaleX(${pct})`;
                };
                const onPointer = (e) => {
                    document.documentElement.style.setProperty('--mouse-x', `${e.clientX}px`);
                    document.documentElement.style.setProperty('--mouse-y', `${e.clientY}px`);
                };
                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('pointermove', onPointer, { passive: true });
                return () => {
                    window.removeEventListener('scroll', onScroll);
                    window.removeEventListener('pointermove', onPointer);
                };
            }, []);

            const handleLogin = () => {
                if (loginPass === ADMIN_PASS) {
                    setIsAdmin(true); setShowLogin(false); setLoginPass(''); setLoginError(false);
                } else { setLoginError(true); }
            };
            const handleAdminClick = () => {
                if (isAdmin) setIsAdmin(false);
                else { setShowLogin(true); setLoginPass(''); setLoginError(false); }
            };
            const handleClearDB = () => {
                if (confirm('Are you sure you want to reset all custom uploads and restore the default editorial template? This will update both Cloud Firestore and local storage.')) {
                    clearCloudState().then(() => {
                        dispatch({ type: 'SET_STATE', state: DEFAULT_STATE });
                    });
                }
            };
            const handleExport = () => {
                fetch(window.location.href)
                    .then(res => {
                        if (!res.ok) throw new Error('Network error');
                        return res.text();
                    })
                    .then(html => {
                        const placeholder = 'const INITIAL_PERSISTED_STATE = null; // EXPORT_STATE_PLACEHOLDER';
                        const replacement = `const INITIAL_PERSISTED_STATE = ${JSON.stringify(uploads)}; // EXPORT_STATE_PLACEHOLDER`;
                        let newHtml = html;
                        if (html.includes(placeholder)) {
                            newHtml = html.replace(placeholder, replacement);
                        } else {
                            newHtml = html.replace(/const INITIAL_PERSISTED_STATE = [\s\S]*?; \/\/ EXPORT_STATE_PLACEHOLDER/, replacement);
                        }
                        const blob = new Blob([newHtml], { type: 'text/html' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'index.html';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    })
                    .catch(err => {
                        console.error('Export error:', err);
                        alert('CORS Restriction: To export your customized website, please run the page using a local web server (e.g. using VS Code Live Server or by running "npx serve" in your project directory).\n\nIf you double-clicked the HTML file directly (file:///), the browser prevents exporting for security reasons.');
                    });
            };
            return (
                <Fragment>
                    <div className="scroll-progress-bar" />
                    <div className="ambient-spotlight" />
                    {/* Pre-load classes to prevent Tailwind CDN flashing on scroll */}
                    <div className="hidden py-3 bg-cream/90 backdrop-blur-xl shadow-[0_1px_0_rgba(0,0,0,0.04)]" />
                    {loading && (
                        <div className="page-loader">
                            <span className="loader-text">PORTFOLIO</span>
                            <span className="loader-sub">Creative</span>
                        </div>
                    )}
                    {isAdmin && (
                        <div className="fixed top-0 left-0 right-0 h-[40px] z-[100000] bg-charcoal/95 backdrop-blur-md text-white text-xs font-mono px-6 shadow-md flex items-center justify-between border-b border-white/10 select-none">
                            <div className="flex items-center gap-3">
                                <span className="w-2.5 h-2.5 bg-green-500 rounded-full inline-block" style={{ animation: 'loaderPulse 1.5s ease-in-out infinite' }} />
                                <span className="font-sans font-bold text-white/90">Priya Srivastava Admin Panel</span>
                                <span className={`text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wider font-semibold flex items-center gap-1 ${
                                    syncStatus === 'synced' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' :
                                    syncStatus === 'saving' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                                    'bg-sky-500/20 text-sky-300 border border-sky-500/30'
                                }`}>
                                    {syncStatus === 'synced' ? '☁️ Cloud Synced' : syncStatus === 'saving' ? '⚡ Saving...' : '☁️ Cloud Connected'}
                                </span>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={handleExport} className="bg-pink hover:bg-pink-deep text-white font-sans font-bold px-4 py-1.5 rounded-full transition-all flex items-center gap-1.5 shadow" title="Export this custom portfolio as a standalone index.html file ready for hosting">
                                    📥 Export Website
                                </button>
                                <button onClick={handleClearDB} className="text-white/60 hover:text-white hover:underline transition-all">
                                    Reset to Default
                                </button>
                                <button onClick={() => setIsAdmin(false)} className="text-white/40 hover:text-white transition-all font-bold">
                                    Exit Admin Mode
                                </button>
                            </div>
                        </div>
                    )}
                    <Navbar isAdmin={isAdmin} />
                    <main className={isAdmin ? 'pt-[40px]' : ''}>
                        <Hero uploads={uploads} dispatch={dispatch} isAdmin={isAdmin} />
                        <About uploads={uploads} dispatch={dispatch} isAdmin={isAdmin} />
                        <Brands uploads={uploads} dispatch={dispatch} isAdmin={isAdmin} />
                        <Portfolio uploads={uploads} dispatch={dispatch} isAdmin={isAdmin} />
                        <Photos uploads={uploads} dispatch={dispatch} isAdmin={isAdmin} />
                        <Packages uploads={uploads} dispatch={dispatch} isAdmin={isAdmin} />
                        <Testimonials uploads={uploads} dispatch={dispatch} isAdmin={isAdmin} />
                        <Contact uploads={uploads} />
                    </main>
                    <Footer isAdmin={isAdmin} onAdminClick={handleAdminClick} />
                    {showLogin && (
                        <div className="modal-overlay" onClick={() => setShowLogin(false)}>
                            <div className="modal-panel p-8" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-6">
                                    <h3 className="font-display font-bold text-xl text-charcoal flex items-center gap-3">
                                        <span className="w-10 h-10 rounded-full bg-pink-light flex items-center justify-center text-pink-deep text-lg">🔒</span>
                                        Admin Access
                                    </h3>
                                    <button onClick={() => setShowLogin(false)} className="text-light-gray hover:text-charcoal transition-colors"><I.X /></button>
                                </div>
                                <p className="text-sm text-warm-gray mb-5">Enter your admin password to enable editing mode.</p>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-mono text-light-gray uppercase tracking-wider mb-1.5 block">Password</label>
                                        <input type="password" className={`input-field ${loginError ? 'border-red-400 shadow-[0_0_0_3px_rgba(248,113,113,0.1)]' : ''}`} placeholder="Enter password"
                                            value={loginPass} onChange={e => { setLoginPass(e.target.value); setLoginError(false); }}
                                            onKeyDown={e => { if (e.key === 'Enter') handleLogin(); }} autoFocus />
                                        {loginError && <p className="text-xs text-red-400 mt-2 font-medium flex items-center gap-1">✕ Incorrect password. Try again.</p>}
                                    </div>
                                    <button onClick={handleLogin} className="btn-primary w-full justify-center">Unlock Admin Mode</button>
                                </div>
                            </div>
                        </div>
                    )}
                </Fragment>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
